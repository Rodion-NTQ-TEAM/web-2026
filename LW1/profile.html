<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Профиль</title>
    <link rel="stylesheet" href='StyleProfile.css'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="left-menu">
        <div class="menu-item"><a href='main.html'><img src="images/Home%2024.svg"></a></div>
        <div class="menu-item"><a href='profile.html'><img src="images/User%2024.svg"></a></div>
        <div class="menu-item"><a href='newpost.html'><img src="images/Plus%2024.svg"></a></div>
    </div> 
    <div class="main-content">
        <div class="profile-container">
            <img src="images/ava.jpg" alt="Аватар Вани" class="avatar">
            <h1 class="profile-name">Ваня Денисов</h1>
            <p class="profile-bio">Привет! Я системный аналитик в АСМЕ :) Тут моя жизнь только для самых классных!</p>
            <div class="profile-stats">
                <span class="posts-count">
                    <img src='images/Image%2016.svg' alt='Иконка' class='posts-count-icon'>
                    43 поста
                </span>
            </div>
            <!-- Лента с фотографиями -->
            <div class="photo-grid">
                <div class="photo-item"><img src="images/pic1.jpg" alt="Post 1"></div>
                <div class="photo-item"><img src="images/pic2.jpg" alt="Post 2"></div>
                <div class="photo-item"><img src="images/pic3.jpg" alt="Post 3"></div>
                <div class="photo-item"><img src="images/pic4.jpg" alt="Post 4"></div>
                <div class="photo-item"><img src="images/pic5.jpg" alt="Post 5"></div>
                <div class="photo-item"><img src="images/pic6.jpg" alt="Post 6"></div>
                <div class="photo-item"><img src="images/pic7.jpg" alt="Post 7"></div>
                <div class="photo-item"><img src="images/pic8.jpg" alt="Post 8"></div>
                <div class="photo-item"><img src="images/pic9.jpg" alt="Post 9"></div>
            </div>
        </div>
    </div>   
</body>
</html>
